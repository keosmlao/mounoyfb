# FBMONOY — nginx reverse proxy
# ວາງໄວ້ /etc/nginx/sites-available/mounoyfb ແລ້ວ symlink ໄປ sites-enabled
#
# ໄຟລ໌ນີ້ເປັນສະບັບ **ກ່ອນ** ຕິດຕັ້ງໃບຮັບຮອງ — certbot ຈະແກ້ໄຟລ໌ນີ້ເອງ
# ໃສ່ບລັອກ 443 ແລະ ການ redirect ໃຫ້ອັດຕະໂນມັດ

server {
    listen 80;
    listen [::]:80;
    server_name mounoyfb.odienmall.com;

    # ບ່ອນທີ່ certbot ວາງໄຟລ໌ຢືນຢັນ — ຕ້ອງເຂົ້າໄດ້ຜ່ານ http ສະເໝີ
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ບອກ Next.js ວ່າຜູ້ໃຊ້ເຂົ້າມາທາງ https — ບໍ່ດັ່ງນັ້ນ redirect ຈະຜິດ
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # ການດຶງຂໍ້ມູນຈາກ Facebook ອາດໃຊ້ເວລາດົນ
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ນຳເຂົ້າ CSV ໄດ້ເຖິງ 5MB — ເຜື່ອໄວ້ເປັນ 10MB
    client_max_body_size 10m;

    # ບໍ່ບອກເວີຊັນ nginx ໃຫ້ຄົນນອກຮູ້
    server_tokens off;

    # ຫົວຄວາມປອດໄພພື້ນຖານ
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "same-origin"      always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    access_log /var/log/nginx/mounoyfb.access.log;
    error_log  /var/log/nginx/mounoyfb.error.log;
}
